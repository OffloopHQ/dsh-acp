name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  NPM_VERSION: 11.13.0

jobs:
  portable:
    name: Portable Node artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Install exact dependencies
        run: npm ci
      - name: Audit runtime and development dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Test and build
        run: npm run check
      - name: Package and verify release candidates
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          node scripts/package-release.mjs
          node scripts/verify-release.mjs
          node dist/index.js --version
      - name: Upload ephemeral CI candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsh-acp-portable-candidates
          path: release/
          if-no-files-found: error
          retention-days: 7

  bun-standalone-experiment:
    name: Bun standalone experiment
    if: ${{ vars.DSH_ACP_ENABLE_BUN_STANDALONE_CI == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Pin npm and install exact dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Cross-compile six experimental targets
        env:
          DSH_ACP_ENABLE_BUN_STANDALONE: "1"
        run: npm run bundle:all
      - name: Retain only the compile manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsh-acp-bun-standalone-compile-manifest
          path: dist/bin/manifest.json
          if-no-files-found: error
          retention-days: 3
